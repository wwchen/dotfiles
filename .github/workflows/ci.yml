# Format, lint and test on every PR and every push to master.
name: CI

on:
  pull_request:
  push:
    branches: [master]

permissions:
  contents: read

jobs:
  checks:
    # macOS: the scripts target it (stock /bin/bash 3.2, Homebrew paths).
    runs-on: macos-latest
    env:
      HOMEBREW_NO_AUTO_UPDATE: "1"
      HOMEBREW_NO_INSTALL_CLEANUP: "1"
    steps:
      - uses: actions/checkout@v4

      - name: Install tools
        run: brew install just shellcheck bats-core

      # Only on branches that have infra/ (Ansible, OpenTofu); `just lint` covers them there.
      - name: Install Ansible tools
        if: hashFiles('infra/ansible/site.yml') != ''
        run: |
          brew install ansible ansible-lint
          ansible-galaxy collection install -r infra/ansible/requirements.yml -p ~/.ansible/collections --force

      - name: Install OpenTofu
        if: hashFiles('infra/cloudflare/main.tf') != ''
        run: brew install opentofu

      - name: Format
        run: just --fmt --check --unstable

      - name: Lint
        run: just lint

      - name: Test
        run: just test
