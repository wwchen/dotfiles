---
- name: Check secrets are present
  ansible.builtin.assert:
    that:
      - secrets.teslamate.encryption_key | default('') | length > 0
      - secrets.teslamate.db_password | default('') | length > 0
    fail_msg: Fill in teslamate.* in secrets/infra.sops.yaml (`just secrets-edit`).
    quiet: true

- name: Create TeslaMate directories
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    mode: "0750"
  loop:
    - "{{ teslamate_dir }}"
    - "{{ teslamate_dir }}/import"

- name: Fetch custom Grafana dashboards
  ansible.builtin.git:
    repo: "{{ teslamate_custom_dashboards_repo }}"
    dest: "{{ teslamate_dir }}/Teslamate-CustomGrafanaDashboards"
    version: "{{ teslamate_custom_dashboards_version }}"
    depth: 1

- name: Write .env (secrets)
  ansible.builtin.template:
    src: env.j2
    dest: "{{ teslamate_dir }}/.env"
    mode: "0600"
  diff: false

- name: Write docker-compose.yml
  ansible.builtin.template:
    src: docker-compose.yml.j2
    dest: "{{ teslamate_dir }}/docker-compose.yml"
    mode: "0640"

- name: Install backup and restore scripts
  ansible.builtin.template:
    src: "{{ item }}.j2"
    dest: "{{ teslamate_dir }}/{{ item }}"
    mode: "0750"
  loop: [backup.sh, restore.sh]

- name: Run the stack
  community.docker.docker_compose_v2:
    project_src: "{{ teslamate_dir }}"
    state: present
    pull: missing
    remove_orphans: true

- name: Schedule nightly backup
  ansible.builtin.cron:
    name: teslamate backup
    minute: "0"
    hour: "{{ teslamate_backup_hour }}"
    job: "{{ teslamate_dir }}/backup.sh >> {{ teslamate_dir }}/backup.log 2>&1"
