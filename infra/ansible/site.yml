---
- name: Load secrets
  hosts: all
  gather_facts: false
  tags: [always]
  tasks:
    - name: Decrypt secrets/infra.sops.yaml into `secrets`
      community.sops.load_vars:
        file: "{{ playbook_dir }}/../../secrets/infra.sops.yaml"
        name: secrets

- name: Base system
  hosts: pis
  become: true
  roles:
    # Order matters on a fresh Pi (`-e ansible_host=<LAN IP>`): base allows LAN SSH before ufw.
    - role: base
      tags: [base]
    - role: tailscale
      tags: [tailscale]
    - role: docker
      tags: [docker]

- name: TeslaMate
  hosts: teslamate
  roles:
    - role: teslamate
      tags: [teslamate]
