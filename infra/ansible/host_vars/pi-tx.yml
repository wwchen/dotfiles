---
# Reflashing? Remove the old pi-tx from the tailnet first, or the new one becomes pi-tx-1.
# Matches the Pi's current clock (UTC-6). Confirm.
teslamate_tz: America/Chicago
teslamate_grafana_root_url: https://arthur.floo.ca/dash
teslamate_backup_mount: /mnt/usb1
teslamate_backup_dir: /mnt/usb1/rpi-backup/teslamate
# Was running in the old compose file.
teslamate_api_enabled: true
# UIs listen here (reach via `ssh -L`). Not 0.0.0.0: Docker ports bypass ufw.
teslamate_bind_address: 127.0.0.1
