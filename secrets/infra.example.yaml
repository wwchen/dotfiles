# Template for secrets/infra.sops.yaml (`just secrets-init`, then `just secrets-edit`).
# Never commit real values in this file.

# Passphrase for OpenTofu's client-side state encryption. `just secrets-init` fills in a
# random one. Lose it and you have to re-import Cloudflare resources, so keep a copy in
# your password manager.
tofu_state_passphrase: ""

cloudflare:
  # API token with: Account > Cloudflare Tunnel: Edit, Account > Access: Apps and Policies: Edit,
  # Zone > DNS: Edit (floo.ca), Zone > Zone: Read
  api_token: ""
  account_id: ""
  access_allowed_emails:
    - you@example.com

tailscale:
  # Reusable or one-off auth key from https://login.tailscale.com/admin/settings/keys
  authkey: ""

teslamate:
  encryption_key: ""        # keep the existing one, or Tesla API tokens must be re-entered
  db_password: ""
  api_token: ""             # teslamateapi (only if enabled)
  healthcheck_url: ""       # https://hc-ping.com/<uuid> pinged after each successful backup
